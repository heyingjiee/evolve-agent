[project]
name = "evolve"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.97.0",
    "ipykernel>=7.2.0",
    "path>=17.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.14",
    "textual>=8.2.7",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["evolve"]


[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"] # 忽略规则

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolve"]

[project.scripts]
evolve = "evolve.cli.app:app"
